name: 📝 Docs

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  kiira:
    name: 🔎 Validate example docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: ⎔ Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: "package.json"

      - name: 📥 Download deps
        run: pnpm install --frozen-lockfile

      - name: 🔨 Build the CLI
        run: pnpm exec nx run @alemtuzlak/kiira:build

      - name: 🔎 Type-check example docs
        # Invoke the freshly-built CLI by path. The `kiira` bin shim is only
        # linked when @alemtuzlak/kiira's dist exists at install time, which it does
        # not in a from-source checkout (it is built in the step above).
        run: |
          status=0
          cli="$PWD/packages/cli/dist/index.mjs"
          for example in basic react monorepo; do
            echo "::group::kiira check (examples/${example})"
            (cd "examples/${example}" && node "$cli" check --reporter github) || status=1
            echo "::endgroup::"
          done
          exit $status
