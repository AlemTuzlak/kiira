name: 📝 Docs

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  typedown:
    name: 🔎 Validate example docs
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"

      - name: 📥 Download deps
        run: pnpm install --frozen-lockfile

      - name: 🔨 Build the CLI
        run: pnpm exec nx run @typedown/cli:build

      - name: 🔎 Type-check example docs
        # Invoke the freshly-built CLI by path. The `typedown` bin shim is only
        # linked when @typedown/cli's dist exists at install time, which it does
        # not in a from-source checkout (it is built in the step above).
        run: |
          status=0
          cli="$PWD/packages/cli/dist/index.mjs"
          for example in basic react monorepo; do
            echo "::group::typedown check (examples/${example})"
            (cd "examples/${example}" && node "$cli" check --reporter github) || status=1
            echo "::endgroup::"
          done
          exit $status
