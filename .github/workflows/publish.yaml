name: Release

on:
  push:
    branches:
      - main
  # Auto-publish when the "Version Packages" PR is merged. Changesets opens that
  # PR with commits authored by github-actions[bot]; GitHub does not trigger
  # `push` workflows from bot-authored pushes (anti-recursion), so the merge's
  # push to main never fires this workflow. But *merging a PR* is a human action,
  # so the `pull_request: closed` event does fire — we gate it (below) to the
  # `changeset-release/main` PR being merged and run the publish from there.
  pull_request:
    types: [closed]
    branches:
      - main
  # Manual escape hatch — publish the bumped versions without a new merge.
  # `changeset publish` is idempotent and only publishes versions not already on npm.
  workflow_dispatch: {}

# Serialize all release runs (across push / pull_request / dispatch) so two
# events can never publish concurrently.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    # Run in the source repo only (never forks), and for `pull_request` events
    # only when the bot's "Version Packages" PR was actually merged — so a normal
    # PR close doesn't kick off a publish, and a fork PR can't either.
    if: >-
      github.repository_owner == 'AlemTuzlak' &&
      (
        github.event_name != 'pull_request' ||
        (
          github.event.pull_request.merged == true &&
          github.event.pull_request.head.ref == 'changeset-release/main' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    permissions:
      contents: write # changesets pushes the "Version Packages" PR/commits
      pull-requests: write # ...and opens/updates that PR
      id-token: write # npm trusted publishing (OIDC) + provenance attestations
    steps:
      - name: Checkout Repo
        # persist-credentials is required: changesets/action pushes the release
        # PR using the checkout's git credentials. `ref: main` pins the post-merge
        # tip so the `pull_request: closed` run sees the bumped versions (a
        # pull_request checkout would otherwise default to the PR merge ref).
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 # zizmor: ignore[artipacked]
        with:
          ref: main
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: "package.json"
          registry-url: "https://registry.npmjs.org"

      # npm trusted publishing (tokenless OIDC) requires a recent npm.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build:all

      # Creates/refreshes a "Version Packages" PR when changesets are present;
      # when that PR is merged (no changesets left) it publishes the public
      # packages to npm with provenance via OIDC trusted publishing. Configure
      # the trusted publisher for kiira and kiira-core on npmjs.com
      # (Settings → Trusted Publisher → this repo's Release workflow). See
      # RELEASING.md. Private packages (the VS Code extension) are version-bumped
      # only; it is published to the Marketplace by publish-vscode.yaml.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version
          publish: pnpm run release
          commit: "ci: version packages"
          title: "ci: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  # When packages were actually published (the "Version Packages" PR was merged),
  # deploy a fresh build of the docs to production. Runs in the same trusted main
  # context — no `workflow_run`/`release` trigger needed (those don't fire from the
  # changesets GITHUB_TOKEN release anyway).
  deploy-docs:
    needs: release
    if: needs.release.outputs.published == 'true'
    # The called workflow's job requests `contents: read`; a reusable workflow
    # can't exceed the caller job's permission ceiling, and the top-level
    # `permissions: {}` grants none — so this job must grant it explicitly or the
    # whole run fails to start ("nested job is requesting 'contents: read', but is
    # only allowed 'contents: none'").
    permissions:
      contents: read
    uses: ./.github/workflows/docs-release.yml
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      REACTBITS_LICENSE_KEY: ${{ secrets.REACTBITS_LICENSE_KEY }}
