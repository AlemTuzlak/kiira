name: Release

on:
  push:
    branches:
      - main
  # Manual escape hatch. Changesets opens the "Version Packages" PR and, when
  # merged, that merge commit is authored by github-actions[bot] — GitHub does
  # not trigger workflows from bot-authored pushes (anti-recursion), so the
  # publish step does not auto-run after merging the version PR. Dispatch this
  # workflow (or push any human-authored commit to main) to publish the bumped
  # versions; `changeset publish` is idempotent and only publishes versions not
  # already on npm.
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    # Only run in the source repo, never on forks.
    if: github.repository_owner == 'AlemTuzlak'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    permissions:
      contents: write # changesets pushes the "Version Packages" PR/commits
      pull-requests: write # ...and opens/updates that PR
      id-token: write # npm trusted publishing (OIDC) + provenance attestations
    steps:
      - name: Checkout Repo
        # persist-credentials is required: changesets/action pushes the release
        # PR using the checkout's git credentials.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: "package.json"
          registry-url: "https://registry.npmjs.org"

      # npm trusted publishing (tokenless OIDC) requires a recent npm.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build:all

      # Creates/refreshes a "Version Packages" PR when changesets are present;
      # when that PR is merged (no changesets left) it publishes the public
      # packages to npm with provenance via OIDC trusted publishing. Configure
      # the trusted publisher for kiira and kiira-core on npmjs.com
      # (Settings → Trusted Publisher → this repo's Release workflow). See
      # RELEASING.md. Private packages (the VS Code extension) are version-bumped
      # only; it is published to the Marketplace by publish-vscode.yaml.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version
          publish: pnpm run release
          commit: "ci: version packages"
          title: "ci: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  # When packages were actually published (the "Version Packages" PR was merged),
  # deploy a fresh build of the docs to production. Runs in the same trusted main
  # context — no `workflow_run`/`release` trigger needed (those don't fire from the
  # changesets GITHUB_TOKEN release anyway).
  deploy-docs:
    needs: release
    if: needs.release.outputs.published == 'true'
    # The called workflow's job requests `contents: read`; a reusable workflow
    # can't exceed the caller job's permission ceiling, and the top-level
    # `permissions: {}` grants none — so this job must grant it explicitly or the
    # whole run fails to start ("nested job is requesting 'contents: read', but is
    # only allowed 'contents: none'").
    permissions:
      contents: read
    uses: ./.github/workflows/docs-release.yml
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      REACTBITS_LICENSE_KEY: ${{ secrets.REACTBITS_LICENSE_KEY }}
