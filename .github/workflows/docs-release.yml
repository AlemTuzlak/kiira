name: 📚 Docs Release

# Regenerate the docs and deploy them to the production docs app on Fly.io.
# Called by the Release workflow when changesets actually publishes (so a new
# docs version goes out with every release), and runnable on demand. It is a
# reusable workflow (workflow_call) rather than a `release:`-triggered one because
# the releases are created by changesets via GITHUB_TOKEN, and events created by
# GITHUB_TOKEN do not trigger other workflows.
#
# Enable by setting:
#   - secret FLY_API_TOKEN
#   - variable FLY_ORG
#   - variable FLY_REGION    (optional)
#   - variable FLY_APP_NAME  (optional; defaults to "kiira-docs")

on:
  # Redeploy production docs whenever docs/ changes land on main — no full
  # package release required. (A release also deploys via the workflow_call
  # below, so version bumps still ship fresh docs.)
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_call:
    secrets:
      FLY_API_TOKEN:
        required: false
      REACTBITS_LICENSE_KEY:
        required: false
  workflow_dispatch: {}

concurrency:
  group: docs-release
  cancel-in-progress: false

permissions: {}

jobs:
  deploy-docs:
    name: 🚀 Deploy production docs
    runs-on: ubuntu-latest
    if: github.repository_owner == 'AlemTuzlak' && vars.FLY_ORG != ''
    permissions:
      contents: read
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # generate:docs reads git branches/tags for versioning
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      # cache-poisoning is moot here: fly-deploy rebuilds the artifact from
      # scratch inside Docker, never from the runner's GitHub Actions cache.
      - name: ⎔ Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version-file: "docs/package.json"

      - name: 📥 Install docs deps
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: 📝 Generate versioned docs
        working-directory: docs
        env:
          APP_ENV: production
        run: pnpm run generate:docs

      - name: 🚀 Deploy to Fly
        id: deploy
        uses: forge-42/fly-deploy@0b6f801f7e8c34efec5ffaf84ed006761781c0df # v1.0.0-rc.2
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG }}
          FLY_REGION: ${{ vars.FLY_REGION }}
        with:
          app_name: ${{ vars.FLY_APP_NAME || 'kiira-docs' }}
          workspace_name: kiira-docs # locates the docs/ folder by its package.json name
          use_isolated_workspace: true
          # License-gated React Bits Pro components are fetched inside the Docker
          # build via this secret (see docs/Dockerfile).
          build_secrets: |
            REACTBITS_LICENSE_KEY=${{ secrets.REACTBITS_LICENSE_KEY }}
          env_vars: |
            APP_ENV=production
            GITHUB_OWNER=${{ github.repository_owner }}
            GITHUB_REPO=${{ github.event.repository.name }}
            GITHUB_REPO_URL=https://github.com/${{ github.repository }}

      - name: 🔗 Deployed URL
        if: steps.deploy.outputs.app_url != ''
        env:
          APP_URL: ${{ steps.deploy.outputs.app_url }}
        run: |
          echo "📚 Docs deployed: $APP_URL" >> "$GITHUB_STEP_SUMMARY"
