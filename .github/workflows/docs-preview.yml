name: 📖 Docs Preview

# Per-PR preview deployments of the docs site to Fly.io.
#
# Each PR that touches docs/ gets its own Fly app `kiira-docs-pr-<number>`, torn
# down by docs-preview-cleanup.yml when the PR closes. Modeled on the forge-42
# base-stack / react-router-devtools docs flow.
#
# Enable by setting (Settings → Secrets and variables → Actions):
#   - secret FLY_API_TOKEN  (a Fly deploy token)
#   - variable FLY_ORG      (your Fly organization slug)
#   - variable FLY_REGION   (optional, e.g. "fra")
# Until FLY_ORG is set the deploy job is skipped, so this never reds the PR.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "docs/**"

concurrency:
  group: docs-preview-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  deploy-preview:
    name: 🚀 Deploy PR preview
    runs-on: ubuntu-latest
    # Skip fork PRs (no access to secrets) and skip until Fly is configured.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.FLY_ORG != ''
    permissions:
      contents: read
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # generate:docs reads git branches/tags for versioning
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: ⎔ Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: "docs/package.json"

      - name: 📥 Install docs deps
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: 📝 Generate versioned docs
        working-directory: docs
        env:
          APP_ENV: production
        run: pnpm run generate:docs

      - name: 🚀 Deploy to Fly
        id: deploy
        uses: forge-42/fly-deploy@0b6f801f7e8c34efec5ffaf84ed006761781c0df # v1.0.0-rc.2
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG }}
          FLY_REGION: ${{ vars.FLY_REGION }}
        with:
          app_name: kiira-docs-pr-${{ github.event.number }}
          workspace_name: kiira-docs # locates the docs/ folder by its package.json name
          use_isolated_workspace: true
          env_vars: |
            APP_ENV=production
            GITHUB_OWNER=${{ github.repository_owner }}
            GITHUB_REPO=${{ github.event.repository.name }}
            GITHUB_REPO_URL=https://github.com/${{ github.repository }}

      - name: 🔗 Preview URL
        if: steps.deploy.outputs.app_url != ''
        env:
          APP_URL: ${{ steps.deploy.outputs.app_url }}
        run: echo "📖 Docs preview deployed: $APP_URL" >> "$GITHUB_STEP_SUMMARY"
