library:
  name: "kiira"
  version: "0.4.0"
  repository: "https://github.com/AlemTuzlak/kiira"
  description: "Extracts TypeScript/JavaScript code fences from Markdown and MDX, type-checks them against the real project API, and maps diagnostics back to the source line (CLI, VS Code, CI)."
  primary_framework: "framework-agnostic"

domains:
  - name: "Onboarding a project"
    slug: onboarding
    description: "Installing Kiira where the project's types resolve, running the first check, and understanding the defaults-first config model."
  - name: "Authoring checkable examples"
    slug: authoring
    description: "Writing Markdown/MDX code fences that type-check, and using fence metadata, grouping, fixtures, and validation modes to express intent — plus debugging a fence that fails unexpectedly."
  - name: "Wiring Kiira to your project"
    slug: project-wiring
    description: "How Kiira resolves your real API: monorepo workspace vs packed resolution, and per-glob compiler overrides for multi-framework docs."
  - name: "Running and integrating"
    slug: running
    description: "Invoking the CLI, reporters and exit codes, CI gating, and the editor experience."

skills:
  - name: "Getting started"
    slug: getting-started
    domain: onboarding
    description: "Add Kiira to a project's docs pipeline: install where types resolve, run kiira check, and create/tweak kiira.config.ts only when defaults aren't enough."
    type: lifecycle
    packages:
      - kiira
    covers:
      - "pnpm add -D kiira (install where the API types live)"
      - "kiira check (default command) and exit code 0 vs 1"
      - "kiira init (scaffolds kiira.config.ts + tsconfig.docs.json)"
      - "defineConfig and the single required option: include"
      - "the fence format (ts/tsx/js/jsx in .md and .mdx)"
      - "tsconfig auto-preference: tsconfig.docs.json over tsconfig.json"
    tasks:
      - "Set up Kiira on an existing docs folder"
      - "Run the first check and read the output"
      - "Decide whether a config file is even needed"
    failure_modes:
      - mistake: "Installing Kiira where types don't resolve"
        mechanism: "Kiira runs tsc against the installed project's types; if it's installed in a docs-only package that doesn't depend on the API package, bare imports won't resolve and every example 'fails'."
        wrong_pattern: |
          # in a standalone docs/ package that doesn't depend on the library
          pnpm add -D kiira
          pnpm kiira check   # all imports of "@my/lib" fail to resolve
        correct_pattern: |
          # install in the project / workspace whose API the docs reference
          pnpm add -D kiira            # at the package (or monorepo root) that has the types
          pnpm kiira check
        source: "docs/content/01-getting-started.mdx (InfoAlert: 'Install it where your types live')"
        priority: HIGH
        status: active
        skills: ["getting-started"]
      - mistake: "Assuming a config file is required"
        mechanism: "include defaults to ['**/*.{md,mdx}'] and every other option has a default, so kiira check runs with no config at all; agents add ceremony that isn't needed."
        wrong_pattern: |
          // agent insists on a full kiira.config.ts before anything works
          export default defineConfig({
            include: ["**/*.md"],
            exclude: [],
            tsconfig: "tsconfig.json",
            packageMode: "workspace",
            defaultValidate: "type",
          })
        correct_pattern: |
          // nothing is required to start; run it, then add config only to narrow/tune
          // (optional) kiira.config.ts:
          export default defineConfig({ include: ["docs/**/*.{md,mdx}", "README.md"] })
        source: "packages/core/src/config.ts (resolveConfig defaults); maintainer interview ('defaults should be good enough for most projects')"
        priority: MEDIUM
        status: active
        skills: ["getting-started"]
      - mistake: "Letting the default include scan the whole repo"
        mechanism: "The default include ['**/*.{md,mdx}'] matches Markdown anywhere; node_modules/dist/.kiira are always ignored, but other vendored or generated Markdown is still checked unless excluded."
        wrong_pattern: |
          export default defineConfig({})  // checks every .md/.mdx in the repo
        correct_pattern: |
          export default defineConfig({
            include: ["docs/**/*.{md,mdx}", "README.md"],
            exclude: ["**/CHANGELOG.md", "**/fixtures/**"],
          })
        source: "packages/core/src/config.ts (default include); packages/core/src/discover.ts (ALWAYS_IGNORE: node_modules, dist, .kiira)"
        priority: MEDIUM
        status: active
        skills: ["getting-started"]

  - name: "Authoring and debugging fences"
    slug: authoring-and-debugging-fences
    domain: authoring
    description: "Write Markdown code fences that type-check, express intent with fence metadata, group multi-step walkthroughs, apply fixtures for needed scope, and debug a fence that fails when the author thinks it shouldn't."
    type: core
    packages:
      - kiira
    covers:
      - "fence metadata tokens: ignore, validate=type|runtime|none, fixture=<name>, name=<id>, group=<id>, group=none, package=workspace|packed"
      - "grouping: explicit group=, defaultGroup: 'file', group=none escape hatch, document-order concatenation"
      - "fixtures: prepend / wrap / file; defaultFixture"
      - "ts->tsx language-tag detection and --fix rewrite"
      - "unused symbols (TS6133) ignored by default; checkUnusedSymbols"
      - "relative imports ignored by default (bare imports always checked); checkRelativeImports"
    tasks:
      - "Write a doc example that compiles against the real API"
      - "Make a multi-fence walkthrough type-check as one unit"
      - "Figure out why a fence fails that the author thinks should pass"
      - "Mark an intentionally-incomplete example so it isn't flagged"
    reference_candidates:
      - topic: "fence metadata tokens"
        reason: "7 tokens with distinct semantics (ignore/validate/fixture/name/group/package) that are easy to confuse with each other"
    failure_modes:
      - mistake: "Continuation fence fails 'cannot find name'"
        mechanism: "Each fence is an isolated module by default (defaultGroup 'none'); a fence that uses a const from an earlier fence can't see it unless they share a group."
        wrong_pattern: |
          ```ts
          const client = createClient()
          ```
          ```ts
          await client.send("hi")   // TS2304: Cannot find name 'client'
          ```
        correct_pattern: |
          ```ts group=quickstart
          const client = createClient()
          ```
          ```ts group=quickstart
          await client.send("hi")   // resolves: same group
          ```
          <!-- or set defaultGroup: "file" in config for literate docs -->
        source: "docs/content/04-fences/02-grouping-snippets.mdx; packages/core/src/virtual.ts (effectiveGroup, isCheckable)"
        priority: HIGH
        status: active
        skills: ["authoring-and-debugging-fences"]
      - mistake: "JSX written in a `ts` fence"
        mechanism: "A `ts` fence containing JSX is mistagged; Kiira warns, checks it as tsx anyway, and can rewrite the tag, but the author often leaves it wrong."
        wrong_pattern: |
          ```ts
          export function Chat() {
            return <div>hi</div>   // JSX in a ts fence
          }
          ```
        correct_pattern: |
          ```tsx
          export function Chat() {
            return <div>hi</div>
          }
          ```
          <!-- or run: kiira check --fix  (rewrites ts -> tsx) -->
        source: "docs/content/04-fences/03-language-tag-checking.mdx; packages/core/src/detect.ts"
        priority: HIGH
        status: active
        skills: ["authoring-and-debugging-fences"]
      - mistake: "Confusing ignore vs validate=none vs group=none"
        mechanism: "group=none only detaches a fence from file grouping — it is still type-checked; to skip checking you need ignore or validate=none."
        wrong_pattern: |
          ```ts group=none
          const wip = somethingNotReadyYet()   // still type-checked, still fails
          ```
        correct_pattern: |
          ```ts ignore
          const wip = somethingNotReadyYet()   // skipped entirely
          ```
          <!-- or: ```ts validate=none  (also skipped) -->
        source: "docs/content/04-fences/01-fence-metadata.mdx, 02-grouping-snippets.mdx; packages/core/src/virtual.ts (isCheckable)"
        priority: HIGH
        status: active
        skills: ["authoring-and-debugging-fences"]
      - mistake: "Snippet needs framework/global scope it doesn't import"
        mechanism: "An isolated fence that relies on ambient setup (e.g. React in scope) fails; a named fixture prepends/wraps that setup."
        wrong_pattern: |
          ```tsx
          export function Chat() {
            return <div>{useChat().messages.length}</div>  // 'useChat' / React not in scope
          }
          ```
        correct_pattern: |
          // kiira.config.ts
          export default defineConfig({
            fixtures: { react: { type: "wrap", before: "import React from 'react'", after: "" } },
          })
          // doc:
          ```tsx fixture=react
          export function Chat() { return <div>{useChat().messages.length}</div> }
          ```
        source: "README.md (fixtures); packages/core/src/virtual.ts (fixture resolution)"
        priority: MEDIUM
        status: active
        skills: ["authoring-and-debugging-fences"]
      - mistake: "Expecting unused imports/locals to error"
        mechanism: "TS6133 (declared but never read) is suppressed by default because doc snippets routinely import things for illustration; only checkUnusedSymbols: true enforces it."
        wrong_pattern: |
          // agent assumes this fence will fail on the unused import; it passes
          ```ts
          import { foo } from "@my/lib"   // never used — NOT an error by default
          ```
        correct_pattern: |
          // opt in explicitly if you want it enforced
          export default defineConfig({ checkUnusedSymbols: true })
        source: "docs/content/03-configuration/02-options.mdx; packages/core/src/check.ts (noUnusedLocals/Parameters forced off)"
        priority: MEDIUM
        status: active
        skills: ["authoring-and-debugging-fences"]
      - mistake: "Expecting broken relative imports to fail"
        mechanism: "Unresolved relative imports (./x, ../x) are ignored by default because snippets often reference imaginary sibling files; bare package imports are always checked. Enable checkRelativeImports to enforce."
        wrong_pattern: |
          ```ts
          import { helper } from "./does-not-exist"  // NOT flagged by default
          import { real } from "@my/lib"             // always checked
          ```
        correct_pattern: |
          export default defineConfig({ checkRelativeImports: true })  // to enforce relative imports too
        source: "docs/content/03-configuration/02-options.mdx; packages/core/src/check.ts (TS2307 '.' specifier filtered)"
        priority: MEDIUM
        status: active
        skills: ["authoring-and-debugging-fences"]
      - mistake: "Silencing a valid error instead of fixing it"
        mechanism: "When a fence reports a real error (wrong import, renamed export, bad option), an agent reaches for ignore / validate=none / group=none to make the check pass — shipping a broken, copy-pasteable example, which is exactly what Kiira exists to prevent. These tokens are for genuinely-incomplete or non-checkable snippets, not for muting valid diagnostics."
        wrong_pattern: |
          ```ts ignore
          import { renamedAway } from "@my/lib"  // error was real — now hidden, ships broken
          ```
        correct_pattern: |
          ```ts
          import { currentName } from "@my/lib"  // fix the example to match the real API
          ```
          <!-- only use ignore / validate=none for intentionally-incomplete or pseudo-code snippets -->
        source: "maintainer interview"
        priority: CRITICAL
        status: active
        skills: ["authoring-and-debugging-fences"]
      - mistake: "Using validate=runtime"
        mechanism: "validate=runtime currently behaves identically to validate=type (the snippet is type-checked; nothing is executed). Agents should not emit validate=runtime — it implies a runtime-execution mode that does not exist today."
        wrong_pattern: |
          ```ts validate=runtime
          await main()   // no runtime execution happens; this is just type-checked
          ```
        correct_pattern: |
          ```ts
          await main()   // default validate=type is what actually runs
          ```
        source: "packages/core/src/virtual.ts (effectiveValidate/isCheckable); maintainer interview"
        priority: MEDIUM
        status: active
        skills: ["authoring-and-debugging-fences"]

  - name: "Monorepos and frameworks"
    slug: monorepo-and-frameworks
    domain: project-wiring
    description: "Make docs resolve internal workspace packages without hand-written tsconfig paths, and serve multiple JSX frameworks from one docs set via per-glob compiler overrides."
    type: framework
    packages:
      - kiira
    covers:
      - "packageMode: 'workspace' (default) vs 'packed'; per-fence package= override"
      - "workspace discovery from pnpm-workspace.yaml / package.json workspaces; paths derived from package.json exports"
      - "overrides: per-glob compilerOptions; last matching override wins"
      - "jsxImportSource per framework (solid-js, preact, vue); React is the TS default"
      - "TS7026 framework detection + --fix writing a jsxImportSource override into JSON config"
    tasks:
      - "Check docs that import internal @scope/* packages in a monorepo"
      - "Type-check Solid/Preact/Vue JSX fences correctly"
      - "Validate against the published (packed) API shape"
    subsystems:
      - name: "workspace mode"
        config_surface: "auto-discovers workspace, maps package names to source via exports, adds each package's node_modules as a resolution fallback"
      - name: "packed mode"
        config_surface: "resolves against the installed/published form; no workspace path mapping"
    failure_modes:
      - mistake: "Hand-writing tsconfig paths for a monorepo"
        mechanism: "In the default workspace mode Kiira already maps every workspace package to its source from package.json exports; agents add redundant (and often wrong) tsconfig paths."
        wrong_pattern: |
          // tsconfig.docs.json — unnecessary in workspace mode
          { "compilerOptions": { "paths": { "@my/lib": ["../lib/src/index.ts"] } } }
        correct_pattern: |
          // nothing needed: packageMode "workspace" (default) discovers and maps packages
          export default defineConfig({ include: ["docs/**/*.mdx"] })
        source: "docs/content/05-projects/01-monorepos.mdx; packages/core/src/workspace.ts (buildWorkspaceResolution)"
        priority: MEDIUM
        status: active
        skills: ["monorepo-and-frameworks"]
      - mistake: "Non-React JSX checked against React types"
        mechanism: "jsxImportSource defaults to the TS/React runtime; Solid/Preact/Vue fences need a per-glob override or their types are wrong (often surfacing as TS7026)."
        wrong_pattern: |
          // Solid docs with no override — JSX typed against the wrong runtime
          export default defineConfig({ include: ["docs/**/*.mdx"] })
        correct_pattern: |
          export default defineConfig({
            include: ["docs/**/*.mdx"],
            overrides: [
              { include: ["**/*solid*"], jsxImportSource: "solid-js" },
              { include: ["**/*preact*"], jsxImportSource: "preact" },
            ],
          })
          // or: kiira check --fix  (writes the detected override into a JSON config)
        source: "docs/content/05-projects/02-per-glob-overrides.mdx; packages/core/src/check.ts (TS7026 detection)"
        priority: HIGH
        status: active
        skills: ["monorepo-and-frameworks"]
      - mistake: "Override include glob doesn't match file paths"
        mechanism: "Override globs are matched against actual file paths and the last matching override wins; a glob that doesn't match silently applies no override."
        wrong_pattern: |
          // files live at docs/frameworks/solid/*.mdx
          overrides: [{ include: ["docs/solid/**"], jsxImportSource: "solid-js" }]  // never matches
        correct_pattern: |
          overrides: [{ include: ["docs/frameworks/solid/**"], jsxImportSource: "solid-js" }]
        source: "docs/content/05-projects/02-per-glob-overrides.mdx (last matching override wins)"
        priority: MEDIUM
        status: active
        skills: ["monorepo-and-frameworks"]
      - mistake: "package=packed on an unpublished local package"
        mechanism: "Packed mode resolves against the installed/published form; for a workspace package that isn't published (or not built) it won't resolve."
        wrong_pattern: |
          ```ts package=packed
          import { thing } from "@my/unpublished-pkg"  // not resolvable in packed mode
          ```
        correct_pattern: |
          ```ts
          import { thing } from "@my/unpublished-pkg"  // default workspace mode resolves to source
          ```
        source: "docs/content/05-projects/01-monorepos.mdx; packages/core/src/check.ts"
        priority: MEDIUM
        status: active
        skills: ["monorepo-and-frameworks"]

  - name: "CI integration"
    slug: ci-integration
    domain: running
    description: "Gate CI on doc errors and keep examples current — via the GitHub composite action or a plain exit-code-gated step — with the right reporter and an understanding of the exit codes."
    type: lifecycle
    packages:
      - kiira
    covers:
      - "exit codes: 0 clean, 1 validation errors, 2 config/runtime failure"
      - "reporters: pretty (default, compact; --verbose to expand), json (1-based positions), github (Actions annotations)"
      - "GitHub composite action AlemTuzlak/kiira@v1 (default reporter: github)"
      - "any-CI step gated by exit code"
      - "--static / --raw for clean log capture"
      - "--entry / --ignore overriding include for targeted runs"
    tasks:
      - "Add a docs check that fails the build on errors"
      - "Get inline PR annotations for failing fences"
      - "Run Kiira on a non-GitHub CI runner"
    failure_modes:
      - mistake: "Not distinguishing exit code 2 from 1"
        mechanism: "Exit 1 means docs have type errors; exit 2 means the setup is broken (bad config, unresolved tsconfig). Scripts that treat all non-zero the same misreport a config failure as 'docs broken'."
        wrong_pattern: |
          kiira check || echo "docs have errors"   # also fires on a broken config (exit 2)
        correct_pattern: |
          kiira check; status=$?
          if [ "$status" -eq 2 ]; then echo "Kiira config/setup problem"; fi
          if [ "$status" -eq 1 ]; then echo "docs have type errors"; fi
        source: "docs/content/02-cli/05-exit-codes.mdx; packages/cli/src/index.ts"
        priority: HIGH
        status: active
        skills: ["ci-integration"]
      - mistake: "Using the pretty reporter for CI annotations"
        mechanism: "Inline GitHub annotations come from the github reporter; pretty is compact human output (needs --verbose for full messages) and emits no workflow commands."
        wrong_pattern: |
          - run: pnpm kiira check --reporter pretty   # no inline PR annotations
        correct_pattern: |
          - run: pnpm kiira check --reporter github
          # or use the composite action (reporter defaults to github)
        source: "docs/content/02-cli/03-reporters.mdx, 06-ci/01-github-action.mdx; packages/cli/src/reporters.ts"
        priority: MEDIUM
        status: active
        skills: ["ci-integration"]
      - mistake: "Assuming --entry appends to include"
        mechanism: "--entry (and positional paths) override the include globs rather than adding to them, so a single --entry narrows the run to just that path."
        wrong_pattern: |
          # config: include ["docs/**"]; expecting both docs and README to be checked
          kiira check --entry README.md   # checks ONLY README.md
        correct_pattern: |
          kiira check --entry docs --entry README.md   # both, explicitly
        source: "docs/content/02-cli/02-flags.mdx; packages/cli/src/entries.ts"
        priority: MEDIUM
        status: active
        skills: ["ci-integration"]
      - mistake: "Spinner/color noise in captured logs"
        mechanism: "The animated spinner and ANSI colors render fine in a TTY but pollute redirected CI logs; --static disables the spinner and --raw disables color."
        wrong_pattern: |
          pnpm kiira check > report.txt   # spinner frames + escape codes in the file
        correct_pattern: |
          pnpm kiira check --static --raw > report.txt
          # or: pnpm kiira check --reporter json > report.json
        source: "docs/content/02-cli/02-flags.mdx; packages/cli/src/spinner.ts"
        priority: LOW
        status: active
        skills: ["ci-integration"]

  - name: "Editor (VS Code)"
    slug: editor-vscode
    domain: running
    description: "Get live type-checking of Markdown fences in VS Code, use the commands and quick fixes, and understand that the extension reads the same kiira.config.ts as the CLI."
    type: lifecycle
    packages:
      - kiira
    covers:
      - "live diagnostics on change (debounced) and on save, mapped to the fence line"
      - "commands: Check Current File, Check Workspace, Open Virtual File For Snippet, Restart Kiira Server"
      - "settings: enable, configPath, debounceMs, checkOnChange, checkOnSave, showGeneratedDiagnostics"
      - "quick fixes: TS fixes inside fences + Kiira's ts->tsx and group= fixes"
      - "shares kiira.config.ts with the CLI (editor and CI check the same way)"
    tasks:
      - "Set up live squiggles in Markdown docs"
      - "Inspect the generated virtual file for a confusing fence"
      - "Reload after editing kiira.config.ts"
    failure_modes:
      - mistake: "Editing config without restarting the server"
        mechanism: "The extension caches the resolved config; changes to kiira.config.ts don't take effect until 'Kiira: Restart Kiira Server' runs."
        wrong_pattern: |
          // edit kiira.config.ts, expect diagnostics to update immediately — they don't
        correct_pattern: |
          // Command Palette -> "Kiira: Restart Kiira Server" after changing config
        source: "docs/content/07-vscode/01-overview.mdx; packages/vscode/src/extension.ts"
        priority: MEDIUM
        status: active
        skills: ["editor-vscode"]
      - mistake: "Pointing kiira.configPath at the wrong file"
        mechanism: "configPath is resolved relative to the workspace root; a wrong path means the extension can't load config and behaves as if unconfigured."
        wrong_pattern: |
          { "kiira.configPath": "config/kiira.ts" }   // actual file is ./kiira.config.ts
        correct_pattern: |
          { "kiira.configPath": "kiira.config.ts" }    // default; matches the real path
        source: "docs/content/07-vscode/01-overview.mdx; packages/vscode/src/extension.ts"
        priority: MEDIUM
        status: active
        skills: ["editor-vscode"]
      - mistake: "Enabling showGeneratedDiagnostics for clarity"
        mechanism: "Diagnostics are mapped to the fence line by default; showGeneratedDiagnostics surfaces errors from generated fixture/wrapper code too, which is noisier, not clearer — use 'Open Virtual File' to inspect instead."
        wrong_pattern: |
          { "kiira.showGeneratedDiagnostics": true }   // adds confusing generated-code errors
        correct_pattern: |
          // leave it false (default); run "Kiira: Open Virtual File For Snippet" to debug
        source: "docs/content/07-vscode/01-overview.mdx; packages/vscode/src/diagnostics.ts (selectDiagnostics)"
        priority: LOW
        status: active
        skills: ["editor-vscode"]

tensions:
  - name: "Lenient defaults vs strict validation"
    skills: ["getting-started", "authoring-and-debugging-fences"]
    description: "Kiira ignores unused symbols and unresolved relative imports by default so illustrative snippets don't fail; teams that want strict docs must opt in."
    implication: "An agent assumes everything is checked (and trusts a passing run too much), or flips on checkUnusedSymbols/checkRelativeImports and breaks legitimately-illustrative examples."
  - name: "Isolated fences vs literate continuity"
    skills: ["authoring-and-debugging-fences"]
    description: "Every fence is an isolated module by default, but tutorials are written as a sequence where later fences depend on earlier ones."
    implication: "An agent writes a multi-fence walkthrough assuming shared scope and gets 'cannot find name', or over-groups unrelated fences and hits redeclaration errors."
  - name: "Workspace-source resolution vs packed reality"
    skills: ["monorepo-and-frameworks", "ci-integration"]
    description: "Workspace mode checks docs against package source, which can pass even when the published (packed) type surface differs from what users install."
    implication: "An agent validates only in workspace mode and ships examples that fail against the actually-published package types."
  - name: "Auto-fix convenience vs masking real errors"
    skills: ["authoring-and-debugging-fences", "ci-integration"]
    description: "--fix mechanically rewrites tags and adds group= tags; relying on it can paper over an example that is genuinely wrong."
    implication: "An agent runs --fix to make CI green and silences a real API mismatch instead of correcting the example."

cross_references:
  - from: getting-started
    to: authoring-and-debugging-fences
    reason: "After install, the first real work is making fences pass — metadata, grouping, fixtures."
  - from: getting-started
