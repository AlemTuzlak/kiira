    reason: "The package= token and framework fixtures depend on how the project resolves packages and JSX runtimes."
  - from: authoring-and-debugging-fences
    to: editor-vscode
    reason: "The editor's quick fixes are the interactive version of the same ts->tsx / group= fixes."
  - from: monorepo-and-frameworks
    to: ci-integration
    reason: "packageMode and overrides decide what CI actually validates."
  - from: editor-vscode
    to: ci-integration
    reason: "Editor and CI share kiira.config.ts, so they should be reasoned about together."

gaps:
  - skill: authoring-and-debugging-fences
    question: "How should agents treat validate=runtime?"
    context: "Resolved (maintainer): agents should ignore/not emit validate=runtime; it behaves like validate=type today. Captured as the 'Using validate=runtime' failure mode."
    status: resolved
  - skill: programmatic-api
    question: "Should a kiira-core programmatic-api skill ship?"
    context: "Resolved (maintainer): drop it. kiira-core is effectively internal; the programmatic-api skill was removed from this map."
    status: resolved
  - skill: authoring-and-debugging-fences
    question: "Top AI-agent-specific failure mode?"
    context: "Resolved (maintainer): agents silence valid errors with ignore/validate=none/group=none instead of fixing them. Captured as a CRITICAL failure mode."
    status: resolved
  - skill: editor-vscode
    question: "Where should the editor skill live given kiira-vscode is private?"
    context: "Resolved (maintainer): keep it in the kiira CLI package so it's discoverable when the CLI is installed."
