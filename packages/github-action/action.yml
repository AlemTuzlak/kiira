name: Typedown
description: Type-check TypeScript and JavaScript code fences in Markdown files.
author: AlemTuzlak
branding:
  icon: check-circle
  color: blue

inputs:
  command:
    description: The Typedown command to run.
    required: false
    default: typedown check
  config:
    description: Path to a Typedown config file.
    required: false
    default: ""
  reporter:
    description: "Reporter to use: pretty, github, json, or sarif."
    required: false
    default: github
  files:
    description: Optional space-separated list of Markdown files/globs to check.
    required: false
    default: ""
  working-directory:
    description: Directory to run Typedown in.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Run Typedown
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        args=()
        if [ -n "${{ inputs.config }}" ]; then
          args+=(--config "${{ inputs.config }}")
        fi
        if [ -n "${{ inputs.reporter }}" ]; then
          args+=(--reporter "${{ inputs.reporter }}")
        fi
        if [ -n "${{ inputs.files }}" ]; then
          # shellcheck disable=SC2206
          extra=(${{ inputs.files }})
          ${{ inputs.command }} "${extra[@]}" "${args[@]}"
        else
          ${{ inputs.command }} "${args[@]}"
        fi
